{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recoup — Automatic Revenue Recovery{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/home.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">Recoup</a>
        <div class="nav-links">
            <a href="{% url 'home' %}#how-it-works">How it works</a>
            <a href="{% url 'home' %}#features">Features</a>
            <a href="{% url 'home' %}#why-recoup">Why Recoup</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn-nav">Go to Dashboard</a>
                <a href="{% url 'logout' %}">Log out</a>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'signup' %}" class="btn-nav">Get Started</a>
            {% endif %}
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
